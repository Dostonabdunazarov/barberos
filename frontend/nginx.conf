server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Разрешаем загрузку фото работ (до 5 МБ + запас).
    client_max_body_size 10m;

    # SPA fallback: любой путь отдаёт index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Проксирование API на backend-контейнер.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Загруженные файлы (фото работ мастеров) — backend раздаёт из wwwroot.
    location /uploads/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Кэширование картинок на клиенте.
        expires 7d;
        add_header Cache-Control "public";
    }
}
