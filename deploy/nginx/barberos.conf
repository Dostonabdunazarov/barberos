# Продовый reverse proxy с терминацией TLS.
# Смонтируйте сертификаты в /etc/nginx/certs (см. docker-compose.prod.yml).
# Замените server_name на реальный домен.

# HTTP → редирект на HTTPS (кроме ACME-челленджа, если используете certbot).
server {
    listen 80;
    server_name barberos.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name barberos.example.com;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # Современный TLS.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Ограничение размера тела запроса (защита от abuse).
    client_max_body_size 2m;

    # Проксируем всё на frontend-контейнер: он отдаёт SPA и сам проксирует /api/ на api.
    location / {
        proxy_pass http://frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
